# Runs the verification gate (scripts/check_parts.py) on the committed parts, G-code, 3MF projects,
# simulation, firmware (config.h, and the controller's C++ replayed against the simulation with the
# runner's g++), viewer manifest, tracker and BOM. It does not re-slice anything: the slicer is not
# installed here, and the G-code's hash stamps tie every file to the STL it was sliced from.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # ubuntu-latest moved to 26.04 in Nov 2026, whose runners could not resolve Ubuntu's mirrors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: OpenGL libraries for OCP (build123d)
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q -o Acquire::Retries=3 libgl1 libglu1-mesa libxrender1 libxext6
      - run: pip install -r requirements.txt
      - name: Verification gate
        run: python scripts/check_parts.py
